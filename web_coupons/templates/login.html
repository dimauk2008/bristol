{% extends 'base.html' %}
{% block title %}Вход — Bristol{% endblock %}
{% block body %}
<div class='share'>
  <div class='ticket' style='max-width:380px'>
    <div class='band'>
      <div class='k'>Bristol</div>
      <div class='t'>Панель выдачи</div>
    </div>
    <div class='body'>
      <form method='post' action='/login'>
        <label>Пароль администратора</label>
        <input type='password' name='password' required autofocus placeholder='••••••'>
        {% if error %}<div class='small' style='color:#b42318;margin-top:8px'>Неверный пароль</div>{% endif %}
        <button class='btn block mt2' type='submit'>
          <svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><path d='M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3'/></svg>
          Войти
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
